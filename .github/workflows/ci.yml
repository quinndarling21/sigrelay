name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build
        run: |
          cmake -S . -B build
          cmake --build build
          ./build/sigrelayd

  cursor-api:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cursor Cloud Agents API access
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          test -n "$CURSOR_API_KEY" || { echo "CURSOR_API_KEY secret is not available"; exit 1; }
          code=$(curl --connect-timeout 10 --max-time 30 -s -o me.json -w '%{http_code}' -u "$CURSOR_API_KEY:" https://api.cursor.com/v1/me)
          echo "GET /v1/me -> HTTP $code"
          python3 -c "import json; d=json.load(open('me.json')); print('api key name:', d.get('apiKeyName'))"
          test "$code" = "200"
          code=$(curl --connect-timeout 10 --max-time 30 -s -o models.json -w '%{http_code}' -u "$CURSOR_API_KEY:" https://api.cursor.com/v1/models)
          echo "GET /v1/models -> HTTP $code"
          python3 -c "import json; d=json.load(open('models.json')); print('models available:', len(d.get('items', [])))"
          test "$code" = "200"
